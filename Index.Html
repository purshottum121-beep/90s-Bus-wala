<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horn OK Please - Desi Highway Jukebox</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #f4f4f4;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; padding: 20px 20px 10px; }
        .truck-sign { background: #ffcc00; color: #000; padding: 8px 25px; border: 4px dashed #000; transform: rotate(-2deg); display: inline-block; }
        .truck-sign h1 { font-family: 'Tiro Devanagari Hindi', serif; font-size: 2rem; font-weight: 900; text-transform: uppercase; }
        .container { width: 100%; max-width: 500px; padding: 15px; }
        
        .video-container { position: relative; width: 100%; height: 230px; background: #000; border-radius: 12px; overflow: hidden; border: 3px solid #ffcc00; margin-bottom: 15px; }
        .video-container iframe { width: 100%; height: 100%; }

        .playlist-tabs { display: flex; gap: 5px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .tab-btn.active { background: #ffcc00; color: #000; }

        .playlist { background: rgba(0,0,0,0.9); border-radius: 10px; padding: 10px; max-height: 250px; overflow-y: auto; border: 1px solid #333; display: none; }
        .playlist.active-list { display: block; }
        
        .playlist-item { padding: 8px; border-bottom: 1px solid #222; cursor: pointer; color: #ddd; font-size: 0.85rem; }
        .playlist-item:hover { color: #ffcc00; background: #1a1a1a; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #444; }
    </style>
</head>
<body>

    <header>
        <div class="truck-sign"><h1>Horn OK Please</h1></div>
    </header>

    <div class="container">
        <div class="video-container">
            <iframe id="youtubePlayer" src="https://www.youtube.com/embed/xp5j2IHyTgs?enablejsapi=1" allowfullscreen></iframe>
        </div>

        <div class="playlist-tabs">
            <button class="tab-btn active" onclick="switchList('list1', this)">1. Kumar Sanu Hits</button>
            <button class="tab-btn" onclick="switchList('list2', this)">2. 90s Sadabahar</button>
        </div>

        <!-- List 1 -->
        <div id="list1" class="playlist active-list">
            <div class="playlist-item" onclick="playSong('xp5j2IHyTgs', '0')">00:00 - Is Tarah Aashiqui Ka</div>
            <div class="playlist-item" onclick="playSong('xp5j2IHyTgs', '438')">07:18 - Tujhe Na Dekhu Toh Chain</div>
            <div class="playlist-item" onclick="playSong('xp5j2IHyTgs', '859')">14:19 - Hum Pyaar Hai Tumhare</div>
        </div>

        <!-- List 2: 90s Sadabahar -->
        <div id="list2" class="playlist">
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '0')">00:00 - Milne Ki Tum Koshish</div>
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '358')">05:58 - Mera Sanam Sabse Pyara</div>
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '624')">10:24 - Teri Mohabbat Ne</div>
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '1415')">23:35 - Sona Kitna Sona Hai</div>
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '3154')">52:34 - Kitna Pyara Tujhe</div>
            <div class="playlist-item" onclick="playSong('boj_mDaGVRg', '3531')">58:51 - Ghoonghat Ki Aad Se</div>
        </div>
    </div>

    <script>
        function playSong(videoId, startTime) {
            const iframe = document.getElementById('youtubePlayer');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&start=${startTime}`;
        }
        function switchList(listId, btnElement) {
            document.querySelectorAll('.playlist').forEach(list => list.classList.remove('active-list'));
            document.getElementById(listId).classList.add('active-list');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
