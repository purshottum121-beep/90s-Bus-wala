<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ट्रक वाला - Highway Desi Vibes</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #fff;
            overflow: hidden;
        }

        /* बैकग्राउंड और ग्रेडिएंट */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.7), rgba(5, 7, 12, 0.95)), 
                        url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80') no-repeat center center/cover;
            z-index: -1;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 15px;
            position: relative;
        }

        .main-title {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        .center-quote {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-align: center;
            font-style: italic;
            padding: 0 10px;
        }

        /* प्लेलिस्ट ड्रावर */
        .playlist-drawer {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .playlist-drawer.open {
            max-height: 240px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .playlist-items {
            max-height: 220px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-size: 0.82rem;
            color: #ddd;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            border-radius: 6px;
        }

        .playlist-item:hover, .playlist-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffcc00;
        }

        /* बॉटम प्लेयर पिल */
        .player-pill {
            width: 100%;
            max-width: 420px;
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.3);
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .album-art.playing { animation-play-state: running; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .song-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .song-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.72rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-pause-btn {
            width: 34px;
            height: 34px;
            background: #ffcc00;
            color: #000;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffcc00;
            border-radius: 2px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
        }

        .playlist-items::-webkit-scrollbar { width: 3px; }
        .playlist-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="app-container">
        <div>
            <h1 class="main-title">ट्रक वाला</h1>
        </div>

        <div class="center-quote">
            "सर कटा सकते हैं लेकिन सर झुका सकते नहीं।" 🛞
        </div>

        <div class="playlist-drawer" id="playlistDrawer">
            <div class="playlist-items" id="playlistItems"></div>
        </div>

        <div class="player-pill">
            <div class="player-main">
                <div class="song-info">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=150&q=80" alt="Art" class="album-art" id="albumArt">
                    <div class="song-details">
                        <span class="song-title" id="songTitle">Is Pyar Se Meri Taraf</span>
                        <span class="song-artist" id="songArtist">Kumar Sanu</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn" onclick="prevSong()">⏮</button>
                    <button class="ctrl-btn play-pause-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                    <button class="ctrl-btn" onclick="nextSong()">⏭</button>
                    <button class="ctrl-btn" onclick="togglePlaylist()">☰</button>
                </div>
            </div>

            <div>
                <div class="progress-bar-container" onclick="seekAudio(event)">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">5:10</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" src=""></audio>

    <script>
        const songs = [
            { title: "Is Pyar Se Meri Taraf Na Dekho", artist: "Kumar Sanu", duration: "5:10", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "Ab Tere Dil Mein To", artist: "Kumar Sanu & Alka Yagnik", duration: "4:45", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "Ae Mere Humsafar", artist: "Alka Yagnik & Udit Narayan", duration: "5:50", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "Woh Meri Neend Mera Chain", artist: "Sadhana Sargam", duration: "4:20", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
        ];

        let currentSongIndex = 0;
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const songTitleEl = document.getElementById('songTitle');
        const songArtistEl = document.getElementById('songArtist');
        const albumArt = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playlistDrawer = document.getElementById('playlistDrawer');
        const playlistItemsEl = document.getElementById('playlistItems');

        function renderPlaylist() {
            playlistItemsEl.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentSongIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${index + 1}. ${song.title}</span><span>${song.duration}</span>`;
                item.onclick = () => { currentSongIndex = index; loadSong(currentSongIndex); playAudio(); };
                playlistItemsEl.appendChild(item);
            });
        }

        function loadSong(index) {
            const song = songs[index];
            songTitleEl.innerText = song.title;
            songArtistEl.innerText = song.artist;
            totalTimeEl.innerText = song.duration;
            audio.src = song.src;
            renderPlaylist();
        }

        function togglePlay() { audio.paused ? playAudio() : pauseAudio(); }
        function playAudio() { audio.play(); playPauseBtn.innerText = "⏸"; albumArt.classList.add('playing'); }
        function pauseAudio() { audio.pause(); playPauseBtn.innerText = "▶"; albumArt.classList.remove('playing'); }
        function nextSong() { currentSongIndex = (currentSongIndex + 1) % songs.length; loadSong(currentSongIndex); playAudio(); }
        function prevSong() { currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; loadSong(currentSongIndex); playAudio(); }
        function togglePlaylist() { playlistDrawer.classList.toggle('open'); }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                progressBar.style.width = (audio.currentTime / audio.duration) * 100 + '%';
                let mins = Math.floor(audio.currentTime / 60);
                let secs = Math.floor(audio.currentTime % 60);
                if (secs < 10) secs = '0' + secs;
                currentTimeEl.innerText = `${mins}:${secs}`;
            }
        };

        audio.onended = () => nextSong();

        function seekAudio(e) {
            const width = e.currentTarget.clientWidth;
            if (audio.duration) audio.currentTime = (e.offsetX / width) * audio.duration;
        }

        loadSong(currentSongIndex);
    </script>
</body>
</html>
